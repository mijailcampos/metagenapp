[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metagenapp"
version = "1.0"
description = "MetagenApp metabarcoding pipeline"
authors = [{name="Mijail Campos"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
metagenapp        = "metagenapp.cli.main:app"
metagenapp-launch = "metagenapp.cli.launch:main"
mcrack            = "metagenapp.cli.crack:app"
metagenapp-api    = "metagenapp.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["metagenapp*", "metagenapp_core*"]