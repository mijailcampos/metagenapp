name: metagenapp
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - vsearch>=2.22
  - mafft>=7.5
  - edlib
  - biopython>=1.81
  - joblib>=1.3
  - matplotlib>=3.7
  - numpy>=1.24
  - pandas>=2.0
  - scikit-bio>=0.6
  - scikit-learn>=1.3
  - scipy>=1.11
  - pip
  - pip:
    - fastapi>=0.111
    - uvicorn[standard]>=0.29
    - pydantic>=2.0
    - python-docx>=1.1
    - rich>=13.0
    - typer>=0.12
    - -e .
